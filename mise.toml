# platform is a plexus-ms repo and eats the initiative's own cooking (§ 1.8 PLX): tools pinned here, verbs as mise tasks, checks wired through hk.
# The roles run as root on every tenant's hosts, so they are linted and
# syntax-checked mechanically here, never on the honor system.

# Verbs are asked as `mise :verb` like in every Plexus repo (§ 2 PLX-Repo); that
# form needs the root marker even without sub-projects.
monorepo_root = true
# mise no longer walks the tree for project configs; the root is the only one.
[monorepo]
config_roots = ["."]

[tools]
hk = "latest" # Git hooks
uv = "latest" # required for ansible
ansible = { version = "latest", uvx = true } # syntax check
"pipx:ansible-lint" = { version = "latest", uvx = true } # the roles' static check

[hooks]
postinstall = "hk install --mise"

# Contract verbs (§ 3 PLX-Repo) — the ones a collection repo has no use for exist
# and pass as documented no-ops.

[tasks.dev]
description = "No-op: nothing to start; the roles are applied by tenant playbooks"
run = 'echo "dev: nothing to start in platform"'

[tasks.build]
description = "No-op: the collection ships as source, installed by tag"
run = 'echo "build: nothing to build in platform"'

[tasks.check]
description = "Static checks: ansible-lint over the collection, and a syntax check of a playbook that lists every role"
run = [
    'ansible-lint ansible',
    'ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook --syntax-check -i localhost, tests/all-roles.yml',
    './tests/all-roles-listed.sh',
]

[tasks.test]
description = "No-op: the roles are exercised by the dogfood tenant's playbook runs"
run = 'echo "test: nothing to test in platform"'
